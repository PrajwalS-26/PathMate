spring.application.name=PathMate Backend

# Server Configuration
server.port=8080

# Database Configuration (Supabase PostgreSQL)
# Replace the placeholders below with your actual Supabase credentials
# You can find these in your Supabase project settings under "Database" -> "Connection string"
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db.<your-project-ref>.supabase.co:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:<your-database-password>}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Supabase Connection Pool (HikariCP) Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Spring Security OAuth2 Resource Server Configuration
# Supabase Auth issuer URI for JWT validation
# Replace <YOUR_PROJECT_REF> with your actual Supabase project reference ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<YOUR_PROJECT_REF>.supabase.co/auth/v1
